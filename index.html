.cls{display:grid; gap:8px; margin-top:8px}
.clrow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); border-radius:11px; padding:8px 13px; background:var(--panel)}

.ftab{width:100%; border-collapse:collapse; font-size:.94rem; margin-top:10px}

.ftab{table-layout:fixed}
.ftab td:first-child{width:40%}
.ftab td:last-child{overflow-wrap:anywhere}

.etab td:last-child{color:var(--ink-3)}

.chatbar{display:flex; gap:12px; align-items:center; background:var(--panel-2); border-radius:12px; padding:11px 15px; margin-top:16px; font-size:.93rem}
.exlist{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:6px}
.ex{border:1px solid var(--line); border-radius:12px; padding:11px 15px; background:var(--panel); min-width:0}
.ex .h{display:flex; gap:9px; align-items:center; flex-wrap:wrap}

<script>const DATA = {"week": {"n": 9, "label": "Week 9", "brand": "Week 9", "title": "Data that travels, and a function you never call", "sub": "Two sessions: a reading as a dictionary, then the code that receives it", "lead": "Last week you sent a <b>sentence<\/b>. Fine for a person, useless to a program. This week one message carries <b>three values with names on them<\/b>, and you write the code at the other end that takes them out again. <b>Dictionaries, strings and functions are the content;<\/b> the broker is still given.", "lesson_label": "Why:"}, "sessions": {"1": {"title": "A reading is a dictionary, not a sentence", "goal": "Put several values in one dictionary, turn it into text with <code>json.dumps<\/code>, and say what <b>type<\/b> you are holding at each step.", "two": ["one reading is one <b>dictionary<\/b>", "<code>json.dumps<\/code> turns it into a <b>string<\/b> that can travel"], "recap": "Last week: a topic is a string, and <code>client.publish(topic, text)<\/code> sends text and gives nothing back. All of that stays exactly the same today.", "demos": ["Demo 3: one reading, built and sent", "Demo 4: the telemetry loop, three readings"], "notebooks": ["demo3_telemetry_publisher.ipynb"]}, "2": {"title": "Receiving: a function you write but never call", "goal": "Write a <b>callback<\/b>, turn the bytes that arrive back into a dictionary, and decide something with it.", "two": ["a <b>callback<\/b> is a function you hand over, with no brackets", "<code>.decode()<\/code> then <code>json.loads<\/code> gets your dictionary back"], "recap": "Last session: <code>json.dumps<\/code> turned a dictionary into a string, and <code>publish<\/code> sent it. Today we stand at the other end of the same pipe.", "demos": ["Demo 5: the eighteen-line subscriber", "Demo 6: readings arriving, one decision each"], "notebooks": ["demo4_subscriber_callback.ipynb"]}}, "exercises": {"demo3_telemetry_publisher.ipynb": [{"id": "3.1", "kind": "Fill in", "title": "Build one reading", "task": "Build <code>reading<\/code> as a dictionary with three keys: <code>\"machine\"<\/code> (the text <code>\"M3\"<\/code>), <code>\"temp_c\"<\/code> (the number 91.4) and <code>\"ok\"<\/code> (<code>True<\/code>).", "star": false}, {"id": "3.2", "kind": "Fill in", "title": "Turn it into text and send it", "task": "Turn <code>reading<\/code> into a string with <code>json.dumps<\/code>, publish it to <code>TOPIC<\/code>, and print what you sent.", "star": false}, {"id": "3.3", "kind": "Predict", "title": "Which is which type?", "task": "<b>Predict first:<\/b> what does <code>type(reading)<\/code> say, and what does <code>type(payload)<\/code> say? Write both answers as text, then run.", "star": false}, {"id": "3.4", "kind": "Write it", "title": "A telemetry loop", "task": "Publish <b>three<\/b> readings in a loop. Each one has a new random temperature, rounded to one decimal, and a fourth key <code>\"humidity_pct\"<\/code> set to 45.", "star": false}, {"id": "3.5", "kind": "Write it", "title": "One reading per machine", "task": "Three machines, one message each, <b>to its own topic<\/b>: <code>ine315/&lt;your name>/&lt;machine>/telemetry<\/code>. The machine name goes in the dictionary as well.", "star": true}], "demo4_subscriber_callback.ipynb": [{"id": "4.1", "kind": "Fill in", "title": "Unpack what arrived", "task": "Complete <code>on_message<\/code> so it turns the bytes back into a dictionary and prints the machine and its temperature.", "star": false}, {"id": "4.2", "kind": "Fill in", "title": "Decide when it arrives", "task": "Add the rule: print <code>ALARM<\/code> with the machine and temperature when the temperature is above 90, and <code>ok<\/code> otherwise.", "star": false}, {"id": "4.3", "kind": "Predict", "title": "What arrives, exactly?", "task": "<b>Predict first:<\/b> what type is <code>msg.payload<\/code> before you decode it? Write your answer as text, then run.", "star": false}, {"id": "4.4", "kind": "Fix it", "title": "One pair of brackets", "task": "This line is wrong and the callback will never run. <b>Fix it<\/b>, then check that the client is holding the function itself.", "star": false}, {"id": "4.5", "kind": "Write it", "title": "Count the alarms", "task": "Count how many alarms have arrived so far. The counter must survive between calls, so it <b>cannot<\/b> be an ordinary variable inside the callback.", "star": true}]}, "blocks": [{"session": 1, "id": "C1", "short": "Warm-up", "title": "Warm-up: dictionaries", "cards": [{"kind": "idea", "tag": "PYTHON", "title": "A dictionary stores values with names on them", "points": ["A list stores values <b>in order<\/b>: you get them back by position, <code>x[0]<\/code>.", "A dictionary stores values <b>by name<\/b>: you get them back by key, <code>x[\"temp_c\"]<\/code>.", "<b>The keys are strings<\/b>, in quotes. Forget the quotes and Python looks for a variable of that name.", "You can add a key that was not there when the dictionary was built. Lists cannot do that."], "code": "prices = {\"P100\": 12.5, \"P200\": 30.0}\n\nprint(prices[\"P100\"])        # 12.5\nprices[\"P300\"] = 7.25       # a new key\nprint(prices)"}, {"kind": "predict", "question": "Reading one value back out. What prints?", "code": "reading = {\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": True}\n\nprint(reading[\"temp_c\"])", "options": ["an error", "91.4", "temp_c", "2"], "explain": "The key names the value you want, and the square brackets fetch it. <b>The key is a string<\/b>, so it needs its quotes: <code>reading[temp_c]<\/code> without them is a <code>NameError<\/code>.", "answer": 1, "output": "91.4"}, {"kind": "predict", "question": "Now a key that was never there. What prints?", "code": "reading = {\"machine\": \"M3\", \"temp_c\": 91.4}\nreading[\"ok\"] = True\n\nprint(reading)", "options": ["an error", "{'machine': 'M3', 'temp_c': 91.4, 'ok': True}", "{'machine': 'M3', 'temp_c': 91.4}", "{'ok': True}"], "explain": "<b>Assigning to a key that does not exist creates it.<\/b> That is how a reading grows a fourth field later without breaking anything that was already written.", "answer": 1, "output": "{'machine': 'M3', 'temp_c': 91.4, 'ok': True}"}, {"kind": "classify", "title": "Does this line work?", "bins": ["gets a value out", "puts a value in", "raises an error"], "task": "The dictionary is <code>reading = {\"machine\": \"M3\", \"temp_c\": 91.4}<\/code>. Decide what each line does.", "items": ["print(reading[\"machine\"])", "reading[\"ok\"] = True", "print(reading[\"Temp_c\"])", "reading[\"temp_c\"] = 92.0", "print(reading[0])", "print(reading[\"temp_c\"])"], "after": "<b>Keys are case-sensitive strings<\/b>, so <code>\"Temp_c\"<\/code> is a different key and Python raises a <code>KeyError<\/code>. And a dictionary has no positions, so <code>reading[0]<\/code> asks for a key called <code>0<\/code>, which is not there either. <b>Reading a missing key is an error; writing one is how you add it.<\/b>", "answers": [0, 1, 2, 1, 2, 0]}]}, {"session": 1, "id": "C2", "short": "One reading", "title": "One reading, and how it travels", "cards": [{"kind": "idea", "tag": "IDEA", "title": "Why a dictionary and not three variables", "points": ["It travels as <b>one thing<\/b>. Three variables would be three messages, and they could arrive in any order.", "It is <b>self-describing<\/b>: the receiver sees <code>\"temp_c\"<\/code>, not just a number it has to guess about.", "It can <b>grow<\/b>. Add humidity next week and every receiver that does not care still works.", "<b>The keys are a contract.<\/b> Change a key name and every receiver breaks, which is why teams write the key names down before anyone writes code."], "code": "reading = {\n    \"machine\": \"M3\",\n    \"temp_c\": 91.4,\n    \"ok\": True,\n}\n\nprint(reading)\nprint(reading[\"temp_c\"])"}, {"kind": "demo", "title": "Demo 3: from dictionary to text", "code": "import json\n\nreading = {\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": True}\n\npayload = json.dumps(reading)\nprint(payload)\n\nprint(type(reading))\nprint(type(payload))", "points": ["<code>json.dumps<\/code> gives back a <b>string<\/b> that looks like the dictionary. Look at the quotes in the printed line.", "<b>Python's <code>True<\/code> came out as <code>true<\/code><\/b>, in lower case. JSON is its own format, not Python source.", "<code>dumps<\/code> means <i>dump to string<\/i>. The <code>s<\/code> on the end is the whole mnemonic.", "<b>Nothing was sent yet.<\/b> This step only changes what you are holding."], "output": "{\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}\n<class 'dict'>\n<class 'str'>"}, {"kind": "predict", "question": "Booleans in JSON. What exactly does this print?", "code": "import json\n\nprint(json.dumps({\"ok\": True, \"n\": 3}))", "options": ["an error", "{\"ok\": true, \"n\": 3}", "{'ok': True, 'n': 3}", "{\"ok\": True, \"n\": 3}"], "explain": "Two differences from Python: <b>double quotes<\/b> around the key, and <b>lower-case <code>true<\/code><\/b>. JSON is read by programs written in many languages, so it has its own spelling.", "answer": 1, "output": "{\"ok\": true, \"n\": 3}"}, {"kind": "live", "mode": "types", "title": "The round trip, one step at a time", "tasks": ["Walk it forwards. At which step does it stop being a dictionary?", "Which two steps do you write, and which two happen inside the library?", "At the far end, what would happen if the receiver skipped <code>json.loads<\/code>?"]}, {"kind": "error", "code": "import json\n\nreading = {\"machine\": \"M3\", \"readings\": {1, 2, 3}}\nprint(json.dumps(reading))", "cause": "<b>Not everything can be written as JSON.<\/b> Text, numbers, <code>True<\/code>/<code>False<\/code>, lists and dictionaries can; a set cannot. The fix is to send a list instead: <code>[1, 2, 3]<\/code>. <b>Read the message: it names the type it could not handle.<\/b>", "etype": "TypeError", "msg": "Object of type set is not JSON serializable", "line": 4}]}, {"session": 1, "id": "C3", "short": "The loop", "title": "The telemetry loop", "cards": [{"kind": "demo", "title": "Demo 4: five steps, repeated", "code": "import json, random, time\n\nMY_NAME = \"ahmed\"\nTOPIC   = f\"ine315/{MY_NAME}/telemetry\"\n\nfor i in range(3):\n    reading = {                                  # 1. a dictionary\n        \"machine\": \"M3\",\n        \"temp_c\": round(random.uniform(80, 95), 1),\n        \"ok\": True,\n    }\n    payload = json.dumps(reading)                # 2. dict -> str\n    client.publish(TOPIC, payload)               # 3. send it\n    print(\"sent:\", payload)                      # 4. see it\n    time.sleep(2.0)                              # 5. wait", "points": ["<b>Build, convert, send, show, wait.<\/b> The same five steps every industrial telemetry program has.", "The reading is built <b>inside<\/b> the loop, so every message is a new one.", "<code>round(..., 1)<\/code> keeps one decimal. Without it you send fifteen meaningless digits.", "<b>Only line 3 of the five touches the network.<\/b> The rest is ordinary Python you already write.", "<b>Your numbers will not match mine:<\/b> <code>random.uniform<\/code> gives a different temperature every run."], "output": "sent: {\"machine\": \"M3\", \"temp_c\": 92.7, \"ok\": true}\nsent: {\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}\nsent: {\"machine\": \"M3\", \"temp_c\": 86.3, \"ok\": true}"}, {"kind": "bug", "title": "Every message says the same thing", "code": "import json, random, time\n\nreading = {                                  # built ONCE, outside the loop\n    \"machine\": \"M3\",\n    \"temp_c\": round(random.uniform(80, 95), 1),\n    \"ok\": True,\n}\n\nfor i in range(3):\n    payload = json.dumps(reading)\n    client.publish(TOPIC, payload)\n    print(\"sent:\", payload)", "line": 3, "cause": "<b>The dictionary was built once, outside the loop.<\/b> The loop then sends the same reading three times, with no error and nothing to see at this end. Anyone reading the data downstream believes the machine sat at exactly one temperature. <b>Build it where it changes: inside the loop.<\/b>", "expected": "sent: {\"machine\": \"M3\", \"temp_c\": 92.7, \"ok\": true}\nsent: {\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}\nsent: {\"machine\": \"M3\", \"temp_c\": 86.3, \"ok\": true}", "got": "sent: {\"machine\": \"M3\", \"temp_c\": 92.7, \"ok\": true}\nsent: {\"machine\": \"M3\", \"temp_c\": 92.7, \"ok\": true}\nsent: {\"machine\": \"M3\", \"temp_c\": 92.7, \"ok\": true}"}, {"kind": "live", "mode": "dictbuild", "title": "Build a reading and watch the message", "tasks": ["Change the temperature. Which characters in the JSON change?", "Tick <b>humidity<\/b>. Does the old receiver, which only reads <code>temp_c<\/code>, still work?", "Set the machine name to <code>M 3<\/code> with a space. Is that still valid JSON? Is it a good idea?"]}, {"kind": "yourturn", "minutes": 15, "notebook": "demo3_telemetry_publisher.ipynb", "sub": "In Colab, in <code>demo3_telemetry_publisher.ipynb<\/code>. Your name goes in <code>MY_NAME<\/code> first, as last week.", "chat": "When you see <b>PASS<\/b>, type <b>done<\/b> in the chat. Your readings should appear on the projector as JSON."}, {"kind": "table", "title": "What is examinable from Session 1", "rows": [["Building a dictionary, reading and adding keys", "MQTT brokers and cloud platforms"], ["<code>KeyError<\/code>: what it means and how to read it", "Time-series databases and dashboards"], ["<code>json.dumps<\/code>, and that it returns a <b>string<\/b>", "The JSON standard itself"], ["Saying the <b>type<\/b> at each step of the trip", "Which fields a real plant would send"], ["Building the dictionary inside the loop", "Sampling rates and network cost"], ["Rounding before you send", ""]], "note": "<b>Next session:<\/b> the same pipe, read from the other end. Two new things again — a <b>callback<\/b>, and <code>json.loads<\/code>."}]}, {"session": 2, "id": "D1", "short": "Callbacks", "title": "A function you write but never call", "cards": [{"kind": "idea", "tag": "IDEA", "title": "You cannot write “wait here until a message comes”", "points": ["Everything you have written so far ran when <b>you<\/b> decided: line after line, top to bottom.", "A message can arrive <b>at any time<\/b>, including while your program is doing something else.", "So you <b>hand the library a function<\/b> and say: run this whenever something arrives. That function is a <b>callback<\/b>.", "<b>You never call it yourself.<\/b> You write it, you hand it over, and the library calls it — possibly hundreds of times."], "code": "def on_message(client, userdata, msg):\n    print(\"got:\", msg.payload)\n\nclient.on_message = on_message      # no brackets!"}, {"kind": "predict", "question": "With brackets and without. What are these two things?", "code": "def alarm_line():\n    return \"ALARM\"\n\nprint(type(alarm_line))\nprint(type(alarm_line()))", "options": ["an error", "<class 'function'>\n<class 'str'>", "<class 'str'>\n<class 'str'>", "<class 'function'>\n<class 'function'>"], "explain": "<b><code>alarm_line<\/code> is the function itself. <code>alarm_line()<\/code> is what you get when you run it.<\/b> Handing a library the second one is the single most common callback mistake: it runs the function immediately, and gives the library its result.", "answer": 1, "output": "<class 'function'>\n<class 'str'>"}, {"kind": "error", "code": "def on_message(client, userdata, msg):\n    print(\"got:\", msg.payload)\n\nhandler = on_message()", "cause": "<b>The brackets called it now<\/b>, with no client, no userdata and no message to work on, so Python complains that three arguments are missing. Write <code>handler = on_message<\/code>: hand over the function and let the library supply the three values later.", "etype": "TypeError", "msg": "on_message() missing 3 required positional arguments: 'client', 'userdata', and 'msg'", "line": 4}, {"kind": "idea", "tag": "GIVEN", "title": "Three parameters you never supply yourself", "points": ["<code>client<\/code> — the connection object, in case you want to reply. Usually ignored.", "<code>userdata<\/code> — anything extra you set up earlier. Usually ignored.", "<code>msg<\/code> — <b>the message<\/b>: <code>msg.topic<\/code> is a string, <code>msg.payload<\/code> is bytes.", "<b>You must accept all three, in that order, whether you use them or not<\/b> — because the library will pass all three."], "fhead": ["what you write", "who fills it in"], "formulas": [["def on_message(client, userdata, msg):", "the library, every time"], ["msg.topic", "the topic the message arrived on"], ["msg.payload", "the raw bytes that were sent"], ["client.on_message = on_message", "you, once, before connecting"]]}]}, {"session": 2, "id": "D2", "short": "Unpack it", "title": "Getting your dictionary back", "cards": [{"kind": "idea", "tag": "PYTHON", "title": "Bytes, then text, then a dictionary", "points": ["<code>msg.payload<\/code> arrives as <b>bytes<\/b>: <code>b'{\"machine\": \"M3\"}'<\/code>. The <code>b<\/code> is the clue.", "<code>.decode()<\/code> turns bytes into a <b>string<\/b>.", "<code>json.loads<\/code> turns that string into a <b>dictionary<\/b>. <i>loads<\/i> = load from string.", "<b>Only then<\/b> can you write <code>reading[\"temp_c\"]<\/code>."], "code": "text    = msg.payload.decode()      # bytes -> str\nreading = json.loads(text)          # str   -> dict\n\nprint(reading[\"machine\"], reading[\"temp_c\"])"}, {"kind": "error", "code": "text = '{\"machine\": \"M3\", \"temp_c\": 91.4}'\n\nprint(text[\"machine\"])", "cause": "<b><code>json.loads<\/code> was skipped.<\/b> <code>text<\/code> is still a string, and strings are indexed by <b>position<\/b>: <code>text[0]<\/code> is a character. Python is telling you it wanted a number where you gave it a key. <b>Turn it into a dictionary first.<\/b>", "etype": "TypeError", "msg": "string indices must be integers, not 'str'", "line": 3}, {"kind": "trace", "title": "Step through the callback when a message arrives", "code": "import json\n\ndef on_message(client, userdata, msg):\n    text    = msg.payload.decode()\n    reading = json.loads(text)\n    if reading[\"temp_c\"] > 90:\n        print(\"ALARM\", reading[\"machine\"], reading[\"temp_c\"])\n    else:\n        print(\"ok   \", reading[\"machine\"], reading[\"temp_c\"])\n\n# the library does this when a message lands:\ndeliver(\"ine315/ahmed/telemetry\", '{\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}')", "steps": [{"line": 1, "kind": "line", "note": "", "g": {}, "fn": null, "loc": null, "out": ""}, {"line": 3, "kind": "line", "note": "def only DEFINES the function. Nothing has arrived yet.", "g": {"on_message": "function"}, "fn": null, "loc": null, "out": ""}, {"line": 12, "kind": "line", "note": "A message lands. <b>The library calls your function<\/b> and fills in the three parameters.", "g": {"on_message": "function"}, "fn": "on_message", "loc": {"client": "<__main__._C object at 0x7f1e7279d950>", "userdata": "None", "msg": "<__main__._Msg object at 0x7f1e7279e650>"}, "out": ""}, {"line": 4, "kind": "line", "note": "msg.payload is bytes; decode gives text: {\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}.", "g": {"on_message": "function"}, "fn": "on_message", "loc": {"client": "<__main__._C object at 0x7f1e7279d950>", "userdata": "None", "msg": "<__main__._Msg object at 0x7f1e7279e650>", "text": "'{\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}'"}, "out": ""}, {"line": 5, "kind": "line", "note": "json.loads turns that text into a dictionary: {'machine': 'M3', 'temp_c': 91.4, 'ok': True}.", "g": {"on_message": "function"}, "fn": "on_message", "loc": {"client": "<__main__._C object at 0x7f1e7279d950>", "userdata": "None", "msg": "<__main__._Msg object at 0x7f1e7279e650>", "text": "'{\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}'", "reading": "{'machine': 'M3', 'temp_c': 91.4, 'ok': True}"}, "out": ""}, {"line": 6, "kind": "line", "note": "Is 91.4 greater than 90? <b>True<\/b>.", "g": {"on_message": "function"}, "fn": "on_message", "loc": {"client": "<__main__._C object at 0x7f1e7279d950>", "userdata": "None", "msg": "<__main__._Msg object at 0x7f1e7279e650>", "text": "'{\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}'", "reading": "{'machine': 'M3', 'temp_c': 91.4, 'ok': True}"}, "out": ""}, {"line": 7, "kind": "line", "note": "So this line runs. The callback then finishes and the program goes back to waiting.", "g": {"on_message": "function"}, "fn": "on_message", "loc": {"client": "<__main__._C object at 0x7f1e7279d950>", "userdata": "None", "msg": "<__main__._Msg object at 0x7f1e7279e650>", "text": "'{\"machine\": \"M3\", \"temp_c\": 91.4, \"ok\": true}'", "reading": "{'machine': 'M3', 'temp_c': 91.4, 'ok': True}"}, "out": "ALARM M3 91.4\n"}, {"line": 7, "kind": "return", "note": "on_message() is finished. Back to the line that called it.", "g": {"on_message": "function"}, "fn": null, "loc": null, "out": "ALARM M3 91.4\n"}, {"line": null, "kind": "end", "note": "Finished. The output box shows exactly what Python printed.", "g": {"on_message": "function"}, "fn": null, "loc": null, "out": "ALARM M3 91.4\n"}]}, {"kind": "demo", "title": "Demo 5: the whole subscriber, eighteen lines", "code": "import json\nimport paho.mqtt.client as mqtt\n\nMY_NAME = \"ahmed\"                            # <-- the same name as the publisher\nTOPIC   = f\"ine315/{MY_NAME}/telemetry\"\n\ndef on_message(client, userdata, msg):       # YOU write this\n    text    = msg.payload.decode()           # bytes -> str\n    reading = json.loads(text)               # str   -> dict\n\n    if reading[\"temp_c\"] > 90:\n        print(\"ALARM\", reading[\"machine\"], reading[\"temp_c\"])\n    else:\n        print(\"ok   \", reading[\"machine\"], reading[\"temp_c\"])\n\nclient = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2)\nclient.on_message = on_message               # no brackets\nclient.connect(\"test.mosquitto.org\", 1883, 60)\nclient.subscribe(TOPIC)\nclient.loop_forever()                        # wait for messages", "run": false, "hint": "Run it and it prints nothing, then waits. It only wakes up when a message arrives on your topic — so start your publisher in a second window.", "points": ["<b>Three things happen before the waiting starts:<\/b> you build the client, you hand over the callback, you subscribe.", "<code>client.on_message = on_message<\/code> — <b>no brackets.<\/b>", "<code>loop_forever()<\/code> is the line that waits. Without it the program ends immediately and hears nothing.", "<b>The decision inside is last week's <code>if<\/code>/<code>else<\/code><\/b>, made about data that came from another computer."]}, {"kind": "puzzle", "task": "The callback's body, and the one line that hands it over. <b>Which lines belong inside the function, and which inside the <code>if<\/code>?<\/b>", "lines": ["def on_message(client, userdata, msg):", "text    = msg.payload.decode()", "reading = json.loads(text)", "if reading[\"temp_c\"] > 90:", "print(\"ALARM\", reading[\"machine\"])", "else:", "print(\"ok   \", reading[\"machine\"])", "client.on_message = on_message"], "levels": [0, 1, 1, 1, 2, 1, 2, 0]}, {"kind": "live", "mode": "callback", "title": "Watch the callback fire", "tasks": ["Press <b>send a reading<\/b> a few times. What runs each time, and what does not?", "Move the alarm limit to 85. How many of the same readings are alarms now?", "Turn on <b>the sender's stream<\/b>. Your program is not looping — so why does it keep printing?"]}, {"kind": "classify", "title": "When does each line run?", "bins": ["once, at the start", "every time a message arrives", "never on its own"], "task": "Six lines from the subscriber. Decide when each one runs.", "items": ["client.subscribe(TOPIC)", "reading = json.loads(text)", "def on_message(client, userdata, msg):", "client.on_message = on_message", "print(\"ALARM\", ...)", "client.loop_forever()"], "after": "<b>The <code>def<\/code> line never runs on its own<\/b> — it only creates the function. The <script>const $ = s => document.querySelector(s);

function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

/* ---------------- Python highlighter ---------------- */
const KW=new Set("def class return if elif else for in while and or not True False None import from as pass break continue try except print".split(" "));
const BI=new Set("len range min max sum int float str list dict type enumerate sorted round abs all any zip bool".split(" "));
function hl(line){
  let out=""; const re=/(#.*$)|(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g; let m;
  while((m=re.exec(line))){
    if(m[1]) out+=`<span class="tk-com">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="tk-str">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="tk-num">${m[3]}</span>`;
    else if(m[4]){ const w=m[4]; out+= KW.has(w)?`<span class="tk-kw">${w}</span>`: BI.has(w)?`<span class="tk-fn">${w}</span>`: w; }
    else out+=esc(m[0]);
  }
  return out;
}
function codeHTML(src,opts={}){
  return `<pre class="code ${opts.big?"big":""}">`+src.split("\n").map((l,i)=>
    `<span class="ln ${opts.click?"click":""}" data-l="${i+1}"><span class="no">${i+1}</span>${hl(l)||" "}</span>`).join("")+`</pre>`;
}

function startTimer(min){ const t=$("#timer"); TIMER.left=min*60; TIMER.paused=false; t.classList.add("on"); t.classList.remove("up"); clearInterval(TIMER.id); tick();
  TIMER.id=setInterval(()=>{ if(TIMER.paused) return; TIMER.left--; tick(); if(TIMER.left<=0){ clearInterval(TIMER.id); t.textContent="Time!"; t.classList.add("up"); } },1000); }
function tick(){ const m=Math.floor(TIMER.left/60), s=TIMER.left%60; $("#timer").textContent=`${m}:${String(s).padStart(2,"0")}${TIMER.paused?" ||":""}`; }
$("#timer").onclick=()=>{ if(TIMER.left>0){ TIMER.paused=!TIMER.paused; tick(); } };
$("#timer").ondblclick=()=>{ clearInterval(TIMER.id); $("#timer").classList.remove("on","up"); };

R.error=(e,card)=>{
  const E=card.c;
  e.innerHTML=head(card,"Which line does Python point to?","Click the line. The error names the line where Python <i>noticed</i> the problem.")+
   `<div class="two"><div>${codeHTML(E.code,{big:true,click:true})}<div class="errline"><b>${esc(E.etype)}</b>: ${esc(E.msg)}</div></div>
    <div><div class="reveal" id="er"><div class="fb" id="ef"></div><div class="cause">${E.cause}</div></div></div></div>`;
  return clickLine(e,E.line,l=>{ $("#ef").innerHTML= l===E.line?`<b style="color:var(--ok)">Yes, line ${E.line}.</b>`: l?`<b style="color:var(--bad)">Python points at line ${E.line}.</b>`:`Python points at <b>line ${E.line}</b>.`; $("#er").classList.add("show"); });
};
R.bug=(e,card)=>{
  const B=card.c;
  e.innerHTML=head(card,esc(B.title),"<b>No error message.</b> The code runs, but the answer is wrong. Click the line that causes it.")+
   `<div class="two"><div>${codeHTML(B.code,{big:true,click:true})}
     <div class="exp"><div class="box want"><span class="k">we wanted</span>${esc(B.expected)}</div><div class="box got"><span class="k">Python printed</span>${esc(B.got)}</div></div></div>
    <div><div class="reveal" id="er"><div class="fb" id="ef"></div><div class="cause">${B.cause}</div></div></div></div>`;
  return clickLine(e,B.line,l=>{ $("#ef").innerHTML= l===B.line?`<b style="color:var(--ok)">Yes, line ${B.line}.</b>`: l?`<b style="color:var(--bad)">The cause is line ${B.line}.</b>`:`The cause is <b>line ${B.line}</b>.`; $("#er").classList.add("show"); });
};
R.demo=(e,card)=>{
  const D=card.c, b=card.block, nb=DATA.sessions[card.session].notebooks[0];
  e.innerHTML=head(card,esc(D.title),`Watch it being typed. Then run it yourself in <code>${nb}</code>.`)+
   `<div class="two wide-left"><div>${codeHTML(D.code)}
     ${D.output!==undefined?`<div class="row" style="margin-top:10px"><button class="btn primary" id="runb">&#9654; Run</button><span class="hint">or press <kbd>&rarr;</kbd></span></div>
      <div class="reveal" id="ro"><div class="cap">Output</div><pre class="out">${esc(D.output)}</pre></div>`:`<p class="hint">${D.hint||"Run it in Colab to see the output."}</p>`}</div>
    <div><ul class="points">${D.points.map(p=>`<li>${p}</li>`).join("")}</ul></div></div>`;
  if(D.output===undefined) return {};
  let shown=false; const show=()=>{ shown=true; $("#ro").classList.add("show"); $("#runb").disabled=true; };
  $("#runb").onclick=show;
  return {advance(){ if(!shown){ show(); return true; } return false; }};
};
R.classify=(e,card)=>{
  const C=card.c, pick=C.items.map(()=>-1); let checked=false;
  e.innerHTML=head(card,esc(C.title),C.task)+
   `<div class="cls">${C.items.map((it,i)=>`<div class="clrow" id="cl${i}"><div class="cli"><code>${esc(it)}</code></div>
      <div class="clb">${C.bins.map((b,j)=>`<button class="binb" data-i="${i}" data-j="${j}">${b}</button>`).join("")}</div><span class="mark" id="cm${i}"></span></div>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="ck">Check</button><button class="btn" id="sa">Show the answer</button><button class="btn" id="rs2">Reset</button></div>
    <div class="fb" id="fb"></div><div class="reveal" id="af"><div class="notebox">${C.after}</div></div>`;
  const paint=()=>{ C.items.forEach((_,i)=>{ e.querySelectorAll(`.binb[data-i="${i}"]`).forEach(b=>b.classList.toggle("on",+b.dataset.j===pick[i]));
    const ok=pick[i]===C.answers[i]; $("#cl"+i).classList.toggle("ok",checked&&ok); $("#cl"+i).classList.toggle("no",checked&&pick[i]>=0&&!ok);
    $("#cm"+i).textContent=checked?(ok?"✓":(pick[i]<0?"?":"✗")):""; }); };
  e.querySelectorAll(".binb").forEach(b=>b.onclick=()=>{ pick[+b.dataset.i]=+b.dataset.j; checked=false; $("#fb").textContent=""; paint(); });
  const done=()=>{ checked=true; paint(); const n=C.items.filter((_,i)=>pick[i]===C.answers[i]).length;
    $("#fb").innerHTML= n===C.items.length?`<b style="color:var(--ok)">All ${n} right.</b>`:`<b style="color:var(--bad)">${n} of ${C.items.length} right.</b> Look again at the ones marked &#10007;.`;
    if(n===C.items.length) $("#af").classList.add("show"); };
  $("#ck").onclick=done;
  $("#sa").onclick=()=>{ C.answers.forEach((a,i)=>pick[i]=a); checked=true; paint(); $("#fb").textContent="The answer."; $("#af").classList.add("show"); };
  $("#rs2").onclick=()=>{ pick.fill(-1); checked=false; $("#fb").textContent=""; $("#af").classList.remove("show"); paint(); };
  paint();
  return {advance(){ if(!checked){ done(); return true; } if(!$("#af").classList.contains("show")){ $("#af").classList.add("show"); return true; } return false; }};
};
R.yourturn=(e,card)=>{
  const c=card.c, X=DATA.exercises[c.notebook]||[], m=c.minutes||12;
  e.innerHTML=head(card,`Your turn: exercises ${X.length?X[0].id+"–"+X[X.length-1].id:""}`,c.sub)+
   `<div class="exlist">${X.map(x=>`<div class="ex"><div class="h"><span class="id">${x.id}</span><span class="kind">${esc(x.kind)}</span><b>${esc(x.title)}</b>${x.star?`<span class="star">&#9733; extra</span>`:""}</div><div class="task">${x.task}</div></div>`).join("")}</div>
   <div class="chatbar"><span>${c.chat}</span><span style="flex:1"></span><button class="btn blue" id="tm">Start ${m}-minute timer</button></div>`;
  $("#tm").onclick=()=>startTimer(m);
};
R.table=(e,card)=>{
  const T=card.c;
  e.innerHTML=head(card,esc(T.title))+`<table class="etab"><thead><tr><th>Examinable · Python</th><th>Not examinable · given</th></tr></thead>
   <tbody>${T.rows.map(([a,b])=>`<tr><td style="color:inherit;font-weight:500">${a}</td><td>${b}</td></tr>`).join("")}</tbody></table>
   <div class="chatbar" style="margin-top:18px"><span>${T.note}</span></div>`;
};
R.summary=(e,card)=>{
  e.innerHTML=head(card,DATA.summary_title)+`<table class="sum"><thead><tr>${DATA.summary_heads.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
   <tbody>${DATA.summary.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table>
   <div class="chatbar" style="margin-top:18px"><span>${DATA.summary_note}</span></div>`;
};

/* ---------------- live cards ---------------- */
R.live=(e,card)=>{
  const L=card.c;
  const sub={types:"<b>Walk the round trip.</b> Each step shows what you are holding and what type it is.",
    dictbuild:"<b>Change the reading.</b> The dictionary, the JSON text and what the receiver gets are all rebuilt as you type.",
    callback:"<b>Send a reading.</b> Your callback is not running until a message lands; then it runs once, from top to bottom."}[L.mode];
  if(window.LIVE_STOP) LIVE_STOP();
  e.innerHTML=head(card,esc(L.title),sub)+`<div class="two wide-left"><div id="stageL"></div>
    <div><pre class="livecode" id="lc"></pre><ul class="tasks">${L.tasks.map(t=>`<li>${t}</li>`).join("")}</ul>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="rs">Start again</button></div></div></div>`;
  live8(L,$("#stageL"));
};
function live8(L,box){
  if(L.mode==="types"){
    const READ={machine:"M3",temp_c:91.4,ok:true};
    const dictTxt=`{'machine': 'M3', 'temp_c': 91.4, 'ok': True}`;
    const jsonTxt=`{"machine": "M3", "temp_c": 91.4, "ok": true}`;
    const STEPS=[
      {who:"you", line:'reading = {"machine": "M3", "temp_c": 91.4, "ok": True}', val:dictTxt, type:"dict", note:"You build it. Values have names on them, and you can index it: <code>reading[\"temp_c\"]</code>."},
      {who:"you", line:"payload = json.dumps(reading)", val:jsonTxt, type:"str", note:"Still on your laptop. It <b>looks</b> like the dictionary, but it is one long string - and <code>True</code> became <code>true</code>."},
      {who:"library", line:"client.publish(TOPIC, payload)", val:"b'"+jsonTxt+"'", type:"bytes", note:"The library turns the text into bytes and puts them on the network. <b>You do not write this step.</b>"},
      {who:"library", line:"msg.payload   (inside the callback)", val:"b'"+jsonTxt+"'", type:"bytes", note:"The same bytes arrive at the other program. Notice the <code>b</code> in front of the quotes."},
      {who:"you", line:"text = msg.payload.decode()", val:jsonTxt, type:"str", note:"Bytes back to text. Still a string: indexing it by a key would be a <code>TypeError</code>."},
      {who:"you", line:"reading = json.loads(text)", val:dictTxt, type:"dict", note:"A dictionary again, in a different program, on a different computer. <b>Now</b> you can write <code>reading[\"temp_c\"]</code>."}];
    let k=0;
    box.innerHTML=`<div class="panelbox">
        <div class="row" style="margin-bottom:10px"><button class="btn sm" id="bk">&larr; back</button><button class="btn sm primary" id="fw">next step &rarr;</button>
          <span class="stepinfo" id="si"></span></div>
        <div id="chain"></div>
        <div class="cap">what you are holding now</div><pre class="out" id="val"></pre>
        <div class="note" id="nt" style="margin-top:10px"></div></div>`;
    const draw=()=>{
      $("#chain").innerHTML=STEPS.map((s,i)=>`<div class="codeline ${i===k?"hit":(i<k?"":"dead")}" style="margin:3px 0">
        <b style="color:${i===k?"var(--red)":"var(--ink-3)"}">${s.type.padEnd(5)}</b>  ${hl(s.line)}
        <span class="stepinfo"> &nbsp;${s.who==="you"?"you write this":"the library does this"}</span></div>`).join("");
      $("#si").textContent=`step ${k+1} of ${STEPS.length}`;
      $("#val").textContent=STEPS[k].val;
      $("#nt").innerHTML=STEPS[k].note;
      $("#lc").innerHTML=`<span class="cm"># where the value is now</span>
${STEPS[k].who==="you"?"your program":"the network / the library"}

<span class="cm"># what you are holding</span>
type  = <span class="res">&lt;class '${STEPS[k].type}'&gt;</span>
value = <span class="res">${esc(STEPS[k].val)}</span>

<span class="cm"># can you write reading["temp_c"] yet?</span>
<span class="${STEPS[k].type==="dict"?"on":"res"}">${STEPS[k].type==="dict"?"yes":"no  - it is a "+STEPS[k].type+" right now"}</span>`;
    };
    $("#fw").onclick=()=>{ k=Math.min(STEPS.length-1,k+1); draw(); };
    $("#bk").onclick=()=>{ k=Math.max(0,k-1); draw(); };
    $("#rs").onclick=()=>{ k=0; draw(); };
    draw(); return;
  }
  if(L.mode==="dictbuild"){
    let machine="M3", temp=91.4, ok=true, hum=false;
    box.innerHTML=`<div class="panelbox">
        <div class="tin"><span>machine</span><input type="text" id="n1" value="M3" maxlength="10"></div>
        <div class="sl"><span>temp_c</span><input type="range" id="s1" min="75" max="99" step="0.1" value="91.4"><b id="v1">91.4</b></div>
        <div class="row" style="margin:8px 0"><label class="ck"><input type="checkbox" id="c1" checked> <code>"ok": True</code></label>
          <label class="ck"><input type="checkbox" id="c2"> add <code>"humidity_pct"</code></label></div>
        <div class="cap">the dictionary you built</div><pre class="out" id="d1"></pre>
        <div class="cap">json.dumps(reading) - the text that travels</div><pre class="out" id="d2"></pre>
        <div class="cap">what the receiver takes out</div><pre class="out" id="d3"></pre></div>`;
    const draw=()=>{
      const py=`{'machine': '${machine}', 'temp_c': ${temp}, 'ok': ${ok?"True":"False"}${hum?", 'humidity_pct': 45":""}}`;
      const js=`{"machine": "${machine}", "temp_c": ${temp}, "ok": ${ok?"true":"false"}${hum?', "humidity_pct": 45':""}}`;
      $("#d1").textContent=py; $("#d2").textContent=js;
      $("#d3").textContent=`reading["machine"]  ->  '${machine}'
reading["temp_c"]   ->  ${temp}
reading["ok"]       ->  ${ok?"True":"False"}` + (hum?`
reading["humidity_pct"] ->  45`:`
reading["humidity_pct"] ->  KeyError`);
      $("#lc").innerHTML=`reading = {
    "machine": <span class="res">"${machine}"</span>,
    "temp_c": <span class="res">${temp}</span>,
    "ok": <span class="res">${ok?"True":"False"}</span>,${hum?'\n    "humidity_pct": <span class="res">45</span>,':""}
}
payload = json.dumps(reading)
print(payload)
<span class="res">${esc(js)}</span>

<span class="cm"># the message is ${js.length} characters long</span>
<span class="cm"># Python True became JSON ${ok?"true":"false"} - lower case</span>`;
    };
    $("#n1").oninput=ev=>{ machine=ev.target.value||"M3"; draw(); };
    $("#s1").oninput=ev=>{ temp=Math.round(+ev.target.value*10)/10; $("#v1").textContent=temp.toFixed(1); draw(); };
    $("#c1").onchange=ev=>{ ok=ev.target.checked; draw(); };
    $("#c2").onchange=ev=>{ hum=ev.target.checked; draw(); };
    $("#rs").onclick=()=>{ machine="M3"; temp=91.4; ok=true; hum=false;
      $("#n1").value="M3"; $("#s1").value=91.4; $("#v1").textContent="91.4"; $("#c1").checked=true; $("#c2").checked=false; draw(); };
    draw(); return;
  }
  if(L.mode==="callback"){
    let limit=90, alarms=0, seen=0, stream=null, last=null;
    const temps=[91.4,84.0,95.2,88.1,92.0,79.6,90.6,86.4,93.3,81.2];
    box.innerHTML=`<div class="panelbox">
        <div class="row" style="margin-bottom:8px"><button class="btn sm primary" id="go">send a reading</button>
          <label class="ck"><input type="checkbox" id="st"> the sender's stream (one every 1.5 s)</label></div>
        <div class="sl"><span>alarm above</span><input type="range" id="s1" min="80" max="96" step="0.5" value="90"><b id="v1">90</b></div>
        <div id="steps" style="margin:10px 0"></div>
        <div class="cap">your program's output</div><div class="console" id="con"></div></div>`;
    const STEPLINES=["a message lands on your topic",
      "the library calls on_message(client, userdata, msg)",
      "text    = msg.payload.decode()",
      "reading = json.loads(text)",
      'if reading["temp_c"] > LIMIT:',
      "print(...)  - then the callback finishes and waits again"];
    const drawSteps=(active)=>{ $("#steps").innerHTML=STEPLINES.map((l,i)=>
      `<div class="codeline ${active>=i?"hit":"dead"}" style="margin:2px 0">${i<2?`<span class="stepinfo">${l}</span>`:hl(l)}</div>`).join(""); };
    const out=(cls,txt)=>{ const c=$("#con"); const d=document.createElement("div"); d.innerHTML=`<span class="${cls}">${esc(txt)}</span>`;
      c.appendChild(d); c.scrollTop=c.scrollHeight; };
    const fire=()=>{
      if(!document.getElementById("con")){ clearInterval(stream); stream=null; return; }
      const t=temps[seen%temps.length]; seen++; last=t; const ts=t.toFixed(1);
      const alarm=t>limit; if(alarm) alarms++;
      drawSteps(5);
      out(alarm?"me":"m",(alarm?"ALARM":"ok   ")+" M3 "+ts);
      $("#lc").innerHTML=`<span class="cm"># nothing in your program is looping.</span>
<span class="cm"># the library called your function, once, with:</span>
msg.topic   = <span class="res">"ine315/ahmed/telemetry"</span>
msg.payload = <span class="res">b'{"machine": "M3", "temp_c": ${ts}, "ok": true}'</span>

text    = msg.payload.decode()
reading = json.loads(text)
reading["temp_c"] = <span class="res">${ts}</span>

if reading["temp_c"] > ${limit}:      <span class="res">${alarm?"True":"False"}</span>
<span class="${alarm?"res":"on"}">${alarm?'    print("ALARM", ...)':'    print("ok   ", ...)'}</span>

<span class="cm"># messages seen: ${seen}   alarms: ${alarms}</span>`;
    };
    $("#go").onclick=fire;
    $("#s1").oninput=ev=>{ limit=+ev.target.value; $("#v1").textContent=limit; };
    $("#st").onchange=ev=>{ clearInterval(stream); stream=null; if(ev.target.checked) stream=setInterval(fire,1500); };
    window.LIVE_STOP=()=>{ clearInterval(stream); stream=null; };
    $("#rs").onclick=()=>{ clearInterval(stream); stream=null; $("#st").checked=false; alarms=0; seen=0; $("#con").innerHTML="";
      drawSteps(-1); $("#lc").innerHTML='<span class="cm"># press "send a reading" - nothing runs until one arrives</span>'; };
    drawSteps(-1);
    $("#lc").innerHTML='<span class="cm"># your callback is written, handed over, and waiting.</span>\n<span class="cm"># press "send a reading" to make a message land.</span>';
    return;
  }
}
/* ---------------- navigation ---------------- */
const chips=$("#chips");
let ch=`<button class="chip" data-t="welcome"><b>W9</b> Start</button>`;
[1,2].forEach(s=>{ ch+=`<button class="chip sep" data-t="s${s}">&#9656; Session ${s}</button>`;
  DATA.blocks.filter(b=>b.session===s).forEach(b=>ch+=`<button class="chip" data-t="${b.id}">${esc(b.short)}</button>`); });
ch+=`<button class="chip" data-t="summary">Summary</button>`;
chips.innerHTML=ch;
chips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ const t=c.dataset.t;
  const i=CARDS.findIndex(x=> t==="welcome"?x.type==="welcome": t==="summary"?x.type==="summary":
    (t[0]==="s"&&t.length===2)?(x.type==="session"&&x.session===+t[1]): (x.block&&x.block.id===t)); go(i); });
function go(i){
  if(window.LIVE_STOP){ LIVE_STOP(); window.LIVE_STOP=null; }
  cur=Math.max(0,Math.min(CARDS.length-1,i)); const c=CARDS[cur];
  $("#stage").innerHTML=`<article class="card" id="card"></article>`;
  ctl=R[c.type]($("#card"),c)||{};
  const key=c.type==="welcome"?"welcome":c.type==="summary"?"summary":c.type==="session"?"s"+c.session:c.block.id;
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.t===key));
  const on=chips.querySelector(".chip.on"); if(on) on.scrollIntoView({block:"nearest",inline:"nearest"});
  if(c.block){ const inB=CARDS.filter(x=>x.block===c.block); $("#where").textContent=`Session ${c.session} · ${c.block.short} · ${c.label} · ${inB.indexOf(c)+1} of ${inB.length}`; }
  else $("#where").textContent=c.label;
  $("#prog").style.width=(cur/(CARDS.length-1)*100)+"%";
  $("#prevBtn").disabled=cur===0; $("#nextBtn").disabled=cur===CARDS.length-1;
  history.replaceState(null,"","#"+cur); window.scrollTo(0,0);
}
function next(){ if(ctl.advance&&ctl.advance()) return; if(cur<CARDS.length-1) go(cur+1); }
function prev(){ if(ctl.back&&ctl.back()) return; if(cur>0) go(cur-1); }
$("#nextBtn").onclick=()=>{ if(cur<CARDS.length-1) go(cur+1); };
$("#prevBtn").onclick=()=>{ if(cur>0) go(cur-1); };
document.addEventListener("keydown",ev=>{ if(ev.target.matches("input,textarea,select")) return;
  if(ev.key==="ArrowRight"||ev.key==="PageDown"){ ev.preventDefault(); next(); }
  if(ev.key==="ArrowLeft"||ev.key==="PageUp"){ ev.preventDefault(); prev(); } });
go(parseInt(location.hash.slice(1))||0);
</script>
